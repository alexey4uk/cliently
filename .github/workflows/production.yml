name: Production CI/CD

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Run Tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, libxml, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy .env for testing
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: composer test

      - name: Code Style Check
        run: ./vendor/bin/pint --test
        continue-on-error: false

  build:
    runs-on: ubuntu-latest
    needs: tests
    name: Build Assets
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [tests, build]
    name: Deploy to Production
    
    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USERNAME_PRODUCTION }}
          key: ${{ secrets.VPS_SSH_KEY_PRODUCTION }}
          port: 22
          script: |
            set -e  # Exit on any error
            
            DEPLOY_PATH="/var/www/cliently/data/www/cliently.by"
            BACKUP_PATH="/var/www/cliently/data/backups"
            REPO_URL="git@github.com:alexey4uk/cliently.git"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            echo "=========================================="
            echo "🚀 Starting Production Deployment"
            echo "Tag: ${{ github.ref_name }}"
            echo "Timestamp: $TIMESTAMP"
            echo "=========================================="
            
            # Create backup directory if it doesn't exist
            mkdir -p "$BACKUP_PATH"
            
            # Navigate to deployment directory
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "❌ ERROR: Repository not found. Please clone it manually first."
              exit 1
            fi
            
            cd "$DEPLOY_PATH"
            
            # Check current branch
            CURRENT_BRANCH=$(git branch --show-current)
            echo "📍 Current branch: $CURRENT_BRANCH"
            
            # ============================================
            # DATABASE BACKUP
            # ============================================
            echo ""
            echo "💾 Creating database backup..."
            
            # If using MySQL, backup with mysqldump
            if command -v mysqldump &> /dev/null; then
              mysqldump -u ${{ secrets.DB_USERNAME_PRODUCTION }} -p'${{ secrets.DB_PASSWORD_PRODUCTION }}' ${{ secrets.DB_DATABASE_PRODUCTION }} > "$BACKUP_PATH/database_${TIMESTAMP}.sql"
              echo "✅ MySQL backup created: database_${TIMESTAMP}.sql"
            fi

            # Keep only last 7 backups
            cd "$BACKUP_PATH"
            ls -t database_*.sql 2>/dev/null | tail -n +8 | xargs -r rm
            echo "🗑️  Old backups cleaned (keeping last 7)"
            
            cd "$DEPLOY_PATH"
            
            # ============================================
            # GIT PULL & CHECKOUT TAG
            # ============================================
            echo ""
            echo "📥 Fetching latest code..."
            
            git fetch --tags origin
            
            echo "🏷️  Checking out tag: ${{ github.ref_name }}"
            git checkout tags/${{ github.ref_name }}
            
            if [ $? -ne 0 ]; then
              echo "❌ ERROR: Failed to checkout tag ${{ github.ref_name }}"
              echo "🔄 Rolling back to previous state..."
              git checkout $CURRENT_BRANCH
              exit 1
            fi
            
            # ============================================
            # .ENV FILE CHECK
            # ============================================
            echo ""
            echo "🔍 Checking .env file..."
            
            if [ ! -f "$DEPLOY_PATH/.env" ]; then
              echo "❌ ERROR: .env file not found!"
              echo "Please create .env file manually on production server"
              exit 1
            fi
            
            chmod 644 "$DEPLOY_PATH/.env"
            echo "✅ .env file exists"
            
            # ============================================
            # INSTALL DEPENDENCIES
            # ============================================
            echo ""
            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction
            
            if [ $? -ne 0 ]; then
              echo "❌ ERROR: Composer install failed"
              exit 1
            fi
            
            echo ""
            echo "📦 Installing NPM dependencies..."
            npm ci --production
            
            if [ $? -ne 0 ]; then
              echo "❌ ERROR: NPM install failed"
              exit 1
            fi
            
            # ============================================
            # BUILD ASSETS
            # ============================================
            echo ""
            echo "🏗️  Building assets..."
            npm run build
            
            if [ $? -ne 0 ]; then
              echo "❌ ERROR: Asset build failed"
              exit 1
            fi
            
            # ============================================
            # LARAVEL OPTIMIZATIONS
            # ============================================
            echo ""
            echo "⚙️  Running Laravel optimizations..."
            
            # Clear all caches first
            php artisan optimize:clear
            
            # Run migrations (WITHOUT fresh)
            echo ""
            echo "🗄️  Running database migrations..."
            php artisan migrate --force
            php artisan db:seed --force
            
            if [ $? -ne 0 ]; then
              echo "❌ ERROR: Migrations failed!"
              echo "🔄 Database backup available at: $BACKUP_PATH/database_${TIMESTAMP}.sql"
              echo "To restore: mysql -u ${{ secrets.DB_USERNAME_PRODUCTION }} -p'${{ secrets.DB_PASSWORD_PRODUCTION }}' ${{ secrets.DB_DATABASE_PRODUCTION }} < $BACKUP_PATH/database_${TIMESTAMP}.sql"
              exit 1
            fi
            
            echo "✅ Migrations completed successfully"
            
            # Cache optimizations for production
            echo ""
            echo "⚡ Caching configuration..."
            php artisan optimize
            php artisan view:cache
            php artisan event:cache
            
            # Optimize composer autoloader
            composer dump-autoload --optimize
            
            # ============================================
            # PERMISSIONS
            # ============================================
            echo ""
            echo "🔐 Setting permissions..."
            chmod -R 755 "$DEPLOY_PATH/storage"
            chmod -R 755 "$DEPLOY_PATH/bootstrap/cache"
            
            # ============================================
            # RESTART SERVICES (if needed)
            # ============================================
            echo ""
            echo "🔄 Restarting services..."
            
            # Restart queue workers (if using)
            php artisan queue:restart
            
            # Restart php-fpm (uncomment if needed)
            # sudo systemctl restart php8.2-fpm
            
            # Reload nginx/apache (uncomment if needed)
            # sudo systemctl reload nginx
            
            echo ""
            echo "=========================================="
            echo "✅ Deployment completed successfully!"
            echo "Tag: ${{ github.ref_name }}"
            echo "Timestamp: $TIMESTAMP"
            echo "=========================================="

      - name: Health Check
        run: |
          echo "🏥 Running health check..."
          
          # Wait a few seconds for services to start
          sleep 5
          
          # Check if site is responding
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://cliently.by/up)
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Health check passed! Site is responding (HTTP $HTTP_CODE)"
          else
            echo "❌ Health check failed! Site returned HTTP $HTTP_CODE"
            echo "⚠️  Manual intervention required"
            exit 1
          fi

      - name: Send Telegram notification on success
        if: success()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="<b>✅ Production Deployment Successful!</b>%0A%0A<b>Version:</b> ${{ github.ref_name }}%0A<b>Site:</b> https://cliently.by%0A<b>Health check:</b> ✅ PASSED%0A<b>Time:</b> $(date '+%Y-%m-%d %H:%M:%S')%0A%0A🚀 Your site is live!"

      - name: Send Telegram notification on failure
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="<b>❌ Production Deployment FAILED!</b>%0A%0A<b>Version:</b> ${{ github.ref_name }}%0A<b>Site:</b> https://cliently.by%0A<b>Time:</b> $(date '+%Y-%m-%d %H:%M:%S')%0A%0A⚠️ Check logs and restore from backup if needed%0A<b>Backup:</b> /var/www/cliently/data/backups/%0A%0A<a href='https://github.com/${{ github.repository }}/actions'>View Logs</a>"

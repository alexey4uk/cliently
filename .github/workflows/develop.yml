name: Develop CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs: 
  tests:
    runs-on: ubuntu-latest
    name: Run Tests
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, libxml, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Check PHP syntax
        run: find app config database routes tests -name "*.php" -exec php -l {} \;

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Check security vulnerabilities
        run: composer audit

      - name: Install NPM Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 775 storage bootstrap/cache

      - name: Execute tests (Unit and Feature tests)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-build-assets
          path: public/build
          retention-days: 1

      - name: Code Style Check (Pint)
        run: ./vendor/bin/pint --test
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-build-assets
          path: public/build
          
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e # Чтобы скрипт падал при первой же ошибке
            DEPLOY_PATH="/var/www/cliently/data/www/dev.cliently.by"
            REPO_URL="git@github.com:alexey4uk/cliently.git"
            
            # Логика клонирования/пулла (уже отличная)
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone -b develop "$REPO_URL" "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            else
              cd "$DEPLOY_PATH"
              git fetch origin
              git checkout develop
              git reset --hard origin/develop
            fi
            
            # Composer
            composer install --no-dev --optimize-autoloader
            
            # .env и Key
            if [ ! -f ".env" ]; then
              cp .env.dev .env
            fi
            chmod 644 .env
            
            if ! grep -q "APP_KEY=base64:" ".env"; then
              php artisan key:generate --force
            fi
            
            # NPM и Build (мы это скачали артефактом, но на сервере тоже запускаем для верности)
            npm install # Лучше просто install, раз это дев-сервер
            npm run build

            # Оптимизация
            php artisan optimize:clear
            php artisan migrate --force
            php artisan db:seed --force
            php artisan optimize

            # Restart queue workers
            php artisan queue:restart
            
            # Финальная проверка
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dev.cliently.by)
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "❌ Ошибка: Статус $HTTP_STATUS"
              exit 1
            fi
            echo "✅ Успех: 200 OK"

      - name: Send Telegram notification on success
        if: success()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="<b>✅ Dev Deployment Successful!</b>%0A%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> ${{ github.event.head_commit.message }}%0A<b>Author:</b> ${{ github.actor }}%0A<b>Site:</b> https://dev.cliently.by%0A<b>Time:</b> $(date '+%Y-%m-%d %H:%M:%S')%0A%0A🚀 Dev environment updated!"

      - name: Send Telegram notification on failure
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="<b>❌ Dev Deployment FAILED!</b>%0A%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> ${{ github.event.head_commit.message }}%0A<b>Author:</b> ${{ github.actor }}%0A<b>Site:</b> https://dev.cliently.by%0A<b>Time:</b> $(date '+%Y-%m-%d %H:%M:%S')%0A%0A⚠️ Tests failed or deployment error%0A%0A<a href='https://github.com/${{ github.repository }}/actions'>View Logs</a>"

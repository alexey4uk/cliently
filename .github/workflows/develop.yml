name: Develop CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  # Общие шаги для сборки и тестирования
  setup:
    runs-on: ubuntu-latest
    outputs:
      node_modules_cache_key: ${{ steps.node_modules_cache_key.outputs.key }}
      vendor_cache_key: ${{ steps.vendor_cache_key.outputs.key }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - id: node_modules_cache_key
        run: echo "key=${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT
      
      - id: vendor_cache_key
        run: echo "key=${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}" >> $GITHUB_OUTPUT

  tests:
    runs-on: ubuntu-latest
    needs: setup
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, libxml, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Check PHP syntax
        run: find app config database routes tests -name "*.php" -exec php -l {} \;

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ needs.setup.outputs.vendor_cache_key }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.dev', '.env');"
        continue-on-error: true

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Check security vulnerabilities
        run: composer audit
        continue-on-error: true

      - name: Generate key
        run: php artisan key:generate
        continue-on-error: true

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-build-assets
          path: public/build
          retention-days: 1

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: composer test

      - name: Code Style Check
        run: |
          ./vendor/bin/pint --test
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-assets
          path: public/build
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build-assets
          path: public/build
          
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            DEPLOY_PATH="/var/www/cliently/data/www/dev.cliently.by"
            REPO_URL="git@github.com:alexey4uk/cliently.git"
            
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Repository not found. Cloning..."
              mkdir -p "$DEPLOY_PATH"
              cd "$(dirname "$DEPLOY_PATH")"
              git clone -b develop "$REPO_URL" "$(basename "$DEPLOY_PATH")"
              cd "$DEPLOY_PATH"
              git checkout develop
            else
              echo "Repository exists. Pulling latest changes..."
              cd "$DEPLOY_PATH"
              git fetch origin
              git checkout develop
              git reset --hard origin/develop
              git pull origin develop
            fi
            
            echo "Current branch: $(git branch --show-current)"
            
            # Setup .env file
            if [ ! -f "$DEPLOY_PATH/.env" ]; then
              echo ".env file not found. Copying from .env.dev..."
              cp "$DEPLOY_PATH/.env.dev" "$DEPLOY_PATH/.env"
            else
              echo ".env file exists. Skipping copy."
            fi
            
            # Set permissions for .env file
            chmod 644 "$DEPLOY_PATH/.env"
            
            # Install dependencies first (before artisan commands)
            composer install --no-dev --optimize-autoloader
            
            # Generate application key if not set (after composer install)
            if ! grep -q "APP_KEY=base64:" "$DEPLOY_PATH/.env" 2>/dev/null; then
              echo "APP_KEY not found. Generating..."
              php artisan key:generate --force
              php artisan config:clear
            else
              echo "APP_KEY already exists. Skipping generation."
            fi
            
            npm ci
            npm run build

            php artisan optimize
            php artisan view:cache
            php artisan event:cache

            php artisan migrate --force
            php artisan db:seed --force
            
            # Проверка статуса сервера после деплоя
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dev.cliently.by)
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "Сервер вернул статус $HTTP_STATUS после деплоя!"
              exit 1
            else
              echo "Сервер успешно запущен и отвечает с кодом 200 OK"
            fi

      - name: Send Telegram notification on success
        if: success()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="<b>✅ Dev Deployment Successful!</b>%0A%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> ${{ github.event.head_commit.message }}%0A<b>Author:</b> ${{ github.actor }}%0A<b>Site:</b> https://dev.cliently.by%0A<b>Time:</b> $(date '+%Y-%m-%d %H:%M:%S')%0A%0A🚀 Dev environment updated!"

      - name: Send Telegram notification on failure
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="<b>❌ Dev Deployment FAILED!</b>%0A%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> ${{ github.event.head_commit.message }}%0A<b>Author:</b> ${{ github.actor }}%0A<b>Site:</b> https://dev.cliently.by%0A<b>Time:</b> $(date '+%Y-%m-%d %H:%M:%S')%0A%0A⚠️ Tests failed or deployment error%0A%0A<a href='https://github.com/${{ github.repository }}/actions'>View Logs</a>"

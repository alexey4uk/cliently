name: CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# Reusable jobs для общих шагов
env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  setup-php:
    runs-on: ubuntu-latest
    outputs:
      php-version: ${{ env.PHP_VERSION }}
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, curl, libxml, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none

  setup-node:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ env.NODE_VERSION }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

  tests:
    needs: [setup-php, setup-node]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.setup-php.outputs.php-version }}
          extensions: mbstring, dom, curl, libxml, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup-node.outputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Build assets
        run: npm run build

      - name: Create Test Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          APP_KEY: ${{ secrets.APP_KEY_TEST || 'base64:dummy-key-for-testing' }}
        run: composer test

      - name: Code Style Check
        run: ./vendor/bin/pint --test

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            DEPLOY_PATH="/var/www/cliently/data/www/dev.cliently.by"
            REPO_URL="git@github.com:alexey4uk/cliently.git"
            
            # Clone or update repository
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Cloning repository..."
              mkdir -p "$(dirname "$DEPLOY_PATH")"
              git clone -b develop "$REPO_URL" "$DEPLOY_PATH"
            else
              echo "Updating repository..."
              cd "$DEPLOY_PATH"
              git fetch origin
              git reset --hard origin/develop
            fi
            
            cd "$DEPLOY_PATH"
            
            # Setup .env (only if missing)
            if [ ! -f ".env" ]; then
              echo "Setting up .env file..."
              cp .env.dev .env
              # Set APP_KEY from secret if provided
              if [ -n "${{ secrets.APP_KEY }}" ]; then
                echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
              fi
            fi
            
            # Install dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Optimize application
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Database operations
            php artisan migrate:fresh --force
            php artisan db:seed --force
            
            # Set permissions (adjust as needed)
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache

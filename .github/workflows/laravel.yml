name: CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, libxml, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.dev', '.env');"
        continue-on-error: true

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate
        continue-on-error: true

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
        continue-on-error: true

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: composer test

      - name: Code Style Check
        run: |
          ./vendor/bin/pint --test
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            DEPLOY_PATH="/var/www/cliently/data/www/dev.cliently.by"
            REPO_URL="git@github.com:alexey4uk/cliently.git"
            
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Repository not found. Cloning..."
              mkdir -p "$DEPLOY_PATH"
              cd "$(dirname "$DEPLOY_PATH")"
              git clone -b develop "$REPO_URL" "$(basename "$DEPLOY_PATH")"
              cd "$DEPLOY_PATH"
              git checkout develop
            else
              echo "Repository exists. Pulling latest changes..."
              cd "$DEPLOY_PATH"
              git fetch origin
              git checkout develop
              git reset --hard origin/develop
              git pull origin develop
            fi
            
            echo "Current branch: $(git branch --show-current)"
            
            # Setup .env file
            if [ ! -f "$DEPLOY_PATH/.env" ]; then
              echo ".env file not found. Copying from .env.dev..."
              cp "$DEPLOY_PATH/.env.dev" "$DEPLOY_PATH/.env"
            else
              echo ".env file exists. Skipping copy."
            fi
            
            # Set permissions for .env file
            chmod 644 "$DEPLOY_PATH/.env"
            
            # Install dependencies first (before artisan commands)
            composer install --no-dev --optimize-autoloader
            
            # Generate application key if not set (after composer install)
            if ! grep -q "APP_KEY=base64:" "$DEPLOY_PATH/.env" 2>/dev/null; then
              echo "APP_KEY not found. Generating..."
              php artisan key:generate --force
              php artisan config:clear
            else
              echo "APP_KEY already exists. Skipping generation."
            fi
            
            npm ci
            npm run build
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate:fresh --force
            php artisan db:seed --force


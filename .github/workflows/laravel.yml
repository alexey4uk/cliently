name: CI/CD for Laravel

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, zip, exif, pcntl, bcmath, gd
          tools: composer:v2

      - name: Setup Node.js (если есть frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node dependencies (если есть)
        run: npm install

      - name: Build assets (если есть)
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test  # Или vendor/bin/phpunit, если PHPUnit напрямую

  deploy:
    needs: test  # Деплой только после успешных тестов
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'  # Деплой только из develop
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/cliently/data/www/dev.cliently.by
            
            rm -rf * .*

            git clone git@github.com:alexey4uk/cliently.git .

            git checkout develop

            cp .env.dev .env

            php artisan key:generate
            
            composer install --ignore-platform-req=ext-bcmath
            
            php artisan migrate:fresh
            
            php artisan db:seed
            
            npm install  
            
            npm run build

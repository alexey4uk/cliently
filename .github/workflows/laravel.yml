name: CI/CD for Laravel

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, zip, exif, pcntl, bcmath, gd
          tools: composer:v2

      - name: Setup Node.js (если есть frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node dependencies (если есть)
        run: npm install

      - name: Build assets (если есть)
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test  # Или vendor/bin/phpunit, если PHPUnit напрямую

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            
            DEPLOY_DIR="/var/www/cliently/data/www/dev.cliently.by"
            
            # Создаем директорию если не существует
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            
            # Проверяем наличие git репозитория
            if [ ! -d .git ]; then
              echo "🚀 Первый деплой..."
              # Клонируем с токеном для доступа
              git clone -b develop git@github.com:alexey4uk/cliently.git .
            else
              echo "🔄 Обновление существующего репозитория..."
              git checkout develop
              git pull origin develop
            fi
            
            # Проверяем нужно ли обновить .env
            if [ -f .env.dev ] && [ ! -f .env ]; then
              cp .env.dev .env
            fi
            
            # HTTP аутентификация (обновляем каждый раз)
            echo 'dev:$apr1$Aa9tQWMu$xc6XDAPJwYfJB49s6CbSr0' > .httpauth
            
            # Установка зависимостей
            composer install -q --ignore-platform-req=ext-bcmath --no-dev
            
            # Миграции
            php artisan migrate:fresh
            
            # Сиды
            php artisan db:seed
            
            # Frontend
            npm ci --silent
            npm run build --silent
            
            # Обновляем ключ если нужно
            if ! grep -q "APP_KEY=base64" .env 2>/dev/null; then
              php artisan key:generate --force
            fi
            
            # Storage link
            php artisan storage:link

            # Optimize
            php artisan optimize
            
            echo "✅ Готово!"
